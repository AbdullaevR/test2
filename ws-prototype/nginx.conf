server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Liveness probe endpoint.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}
