  const actions = '<div class="d-actions">' +
    (e.type === 'service' || e.type === 'pipeline'
      ? '<button class="btn green" onclick="deployEntity(\'' + esc(e.id) + '\')">' +
          (isDeployed(e) ? 'Перезапустить ' + I.refresh : 'Задеплоить') + '</button>'
      : '') +
    (isScenarioType(e) ? '' : '<button class="btn white" onclick="setTab(\'settings\')">Настройки</button>') +
    '<button class="btn danger" onclick="openDelete(\'' + esc(e.id) + '\')">Удалить</button>' +
  '</div>';

  /* название сервиса — метаданные: меняется без передеплоя */
  let meta = '';
  if (e.type === 'service') {
    meta = '<div class="section"><h4>Название сервиса</h4><div class="box">' +
      '<label class="f" style="margin-top:0">Название</label>' +
      '<input class="in" id="ov-name" maxlength="100" value="' + esc(e.name) + '" autocomplete="off" ' +
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();saveServiceName(\'' + esc(e.id) + '\');}">' +
      '<div class="d-actions" style="margin-top:10px">' +
        '<button class="btn green sm" onclick="saveServiceName(\'' + esc(e.id) + '\')">Сохранить</button>' +
      '</div>' +
      '<div class="hint-text">Название — метаданные карточки: сохраняется сразу, без передеплоя сервиса.</div>' +
      '</div></div>';
  }

  return meta + '<div class="section"><h4>Детали</h4>' + rows + '</div>' + extra + actions;
}

function saveServiceName(id) {
  const e = byId(id); if (!e) return;
  const inp = $('ov-name');
  const name = inp ? inp.value.trim() : '';
  if (!name) { toast('Укажите название сервиса'); return; }
  e.name = name;
  e.updated = new Date();
  saveSpaces();
  render();
  toast('Название сервиса сохранено');
}

function row(icon, label, value, isHtml) {
  const v = (isHtml && value && String(value).charAt(0) === '<')
    ? value
    : '<span class="dval' + (isHtml ? ' link' : '') + '" title="' + esc(value) + '">' + esc(value) + '</span>';
  return '<div class="drow"><span class="dico">' + icon + '</span><span class="dlabel">' + esc(label) + '</span>' + v + '</div>';
}

function connStr(e) { return 'postgres://app:pw' + (e.pw || 1) + '@db.internal:5432/' + encodeURIComponent(e.name); }
function toggleReveal() {
  const e = byId(st.selected); if (!e) return;
  e.revealed = !e.revealed;
  const cs = $('cs'); if (cs) cs.textContent = e.revealed ? connStr(e) : '••••••••••••';
  const b = $('rvb'); if (b) b.textContent = e.revealed ? 'Скрыть' : 'Показать';
}
function copyConn() {
  const e = byId(st.selected); if (!e) return;
  const v = connStr(e);
  const done = () => toast('Скопировано: ' + (e.revealed ? v : 'значение Connection Database'));
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done).catch(done);
  else done();
}

/* реплики — одно значение: бэк передаёт его и как минимум, и как максимум */
function repCount(e) {
  if (typeof e.replicas === 'number') return e.replicas;
  if (typeof e.replicasMax === 'number') return e.replicasMax;
  return 1;
}
/* конфигурация Container Apps — готовые наборы vCPU/RAM, как в каталоге cloud.ru */
function containerPreset() {
  const vcpu = typeof st.draftVcpu === 'number' ? st.draftVcpu : 0.1;
  const ramMb = typeof st.draftRamMb === 'number' ? st.draftRamMb : 256;
  return CONTAINER_PRESETS.filter(function (p) { return p.vcpu === vcpu && p.ramMb === ramMb; })[0] || null;
}

function presetLabel(p) { return cpuText(p.vcpu) + ' vCPU · ' + ramText(p.ramMb); }

function containerOptions() {
  const cur = containerPreset();
  let html = '';
  if (!cur) {
    html += '<option value="" selected>' + cpuText(st.draftVcpu) + ' vCPU · ' + ramText(st.draftRamMb) + ' — текущая</option>';
  }
  html += CONTAINER_PRESETS.map(function (p) {
    return '<option value="' + p.id + '"' + (cur && cur.id === p.id ? ' selected' : '') + '>' + presetLabel(p) + '</option>';
  }).join('');
  return html;
}

function containerCostHint() {
  const per = (st.draftVcpu || 0) * RATES.container.vcpu * HOURS + ((st.draftRamMb || 0) / 1024) * RATES.container.ram * HOURS;
  return 'vCPU ' + rate(RATES.container.vcpu) + '/час · RAM ' + rate(RATES.container.ram) + '/ГБ·час. Реплика ≈ ' + fmt(per) + '/мес.';
}

function pickContainerCfg(id) {
  const p = CONTAINER_PRESETS.filter(function (x) { return x.id === id; })[0];
  if (!p) return;
  st.draftVcpu = p.vcpu;
  st.draftRamMb = p.ramMb;
  const hint = $('f-cfg-hint');
  if (hint) hint.textContent = containerCostHint();
  refreshPrice();
}

function branchOptions(cur) {
  const list = ['main', 'master', 'db-prototype'];
  if (cur && list.indexOf(cur) === -1) list.unshift(cur);
  return list.map(function (b) { return '<option' + (cur === b ? ' selected' : '') + '>' + esc(b) + '</option>'; }).join('');
}

function bumpReplicas(d) {
  st.draftReplicas = Math.max(1, Math.min(10, (st.draftReplicas || 1) + d));
  const el = $('f-rep');
  if (el) el.textContent = st.draftReplicas;
  refreshPrice();
}

/* ---------- настройки (единая форма создания и редактирования) ---------- */
function tabSettings(e) {
  /* у сервиса название редактируется на вкладке «Обзор», здесь — только параметры контейнера */
  let fields = '';
  if (e.type !== 'service') {
    fields += '<label class="f">Название</label>' +
      '<input class="in" id="f-name" maxlength="80" value="' + esc(e.name) + '" autocomplete="off">' +
      '<div class="counter" id="f-count">' + e.name.length + '/80</div>';
  }

  if (e.type === 'service') {
    const dRep = typeof st.draftReplicas === 'number' ? st.draftReplicas : repCount(e);
    fields += '<label class="f" style="margin-top:0">Репозиторий</label>' +
      '<div class="locked" title="Репозиторий нельзя изменить после создания">' +
        '<span class="ico">' + I.repo + '</span>' +
        '<span class="val mono">' + esc(e.repo || '—') + '</span>' +
        '<span class="tag">' + esc(e.repoSource || 'Repo') + '</span>' +
      '</div>' +
      '<label class="f">Ветка</label><select class="in" id="f-branch">' + branchOptions(e.branch) + '</select>' +
      '<label class="f">Конфигурация (ресурсы)</label>' +
      '<select class="in" id="f-cfg" onchange="pickContainerCfg(this.value)">' + containerOptions() + '</select>' +
      '<div class="hint-text" id="f-cfg-hint">' + containerCostHint() + '</div>' +
      '<label class="f">Порт приложения</label><div class="port-row">' +
        '<input class="in" id="f-port" value="' + e.port + '" inputmode="numeric">' +
      '</div>' +
      '<label class="f">Количество реплик</label>' +
      '<div class="repl-ctl">' +
        '<button class="btn" onclick="bumpReplicas(-1)" aria-label="Меньше реплик">−</button>' +
        '<span class="val" id="f-rep">' + dRep + '</span>' +
        '<button class="btn" onclick="bumpReplicas(1)" aria-label="Больше реплик">+</button>' +
      '</div>' +
      '<div class="hint-text">Ручное масштабирование: одна и та же величина уходит в Container Apps как минимум и максимум.</div>';
  }
  /* у workflow и pipeline формы настроек в дровере нет: подробности — на странице сценария.
     У базы данных в настройках остаётся только название: DSN смотрим на вкладке «Обзор». */
  if (e.type === 'redis') {
    fields += '<label class="f">Конфигурация</label>' + cfgPicker(REDIS_CONFIGS, st.draftRedisConfig, 'pickRedisConfig') +
      '<label class="f">Диск SSD, ГБ</label>' + diskStepper('draftRedisDisk', 10, 500) +
      '<div class="hint-text">vCPU ' + rate(RATES.redis.vcpu) + '/час · RAM ' + rate(RATES.redis.ram) + '/ГБ·час · SSD ' + rate(RATES.redis.ssd) + '/ГБ·час.</div>';
  }
  if (e.type === 's3') {
    fields += '<label class="f">Регион</label><select class="in" id="f-region">' +
      ['ru-central-1', 'ru-west-1'].map(r => '<option' + (e.region === r ? ' selected' : '') + '>' + r + '</option>').join('') +
      '</select>' +
      '<label class="f">Хранение, ГБ</label>' + selectStep('draftS3Storage', S3_STEPS.storage) +
      '<label class="f">Чтение, тыс. операций в месяц</label>' + selectStep('draftS3Read', S3_STEPS.read) +
      '<label class="f">Запись, тыс. операций в месяц</label>' + selectStep('draftS3Write', S3_STEPS.write) +
      '<label class="f">Исходящий трафик, ГБ в месяц</label>' + selectStep('draftS3Egress', S3_STEPS.egress) +
      '<div class="hint-text">У S3 нет конфигурации vCPU/RAM: тарифицируются хранение, операции чтения/записи и трафик.</div>';
  }

  if (e.type === 'service') {
    /* одна общая кнопка сохранения вместо сохранения под каждым полем */
    return fields + priceBlock() +
      '<div class="d-actions">' +
        '<button class="btn green" onclick="openRedeployConfirm(\'settings\')">Сохранить</button>' +
        '<button class="btn white" onclick="setTab(\'overview\')">Отмена</button>' +
        '<button class="btn danger" onclick="openDelete(\'' + esc(e.id) + '\')">Удалить</button>' +
      '</div>' +
      '<div class="hint-text">Кнопка «Сохранить» применяет все поля формы сразу. Изменения конфигурации требуют передеплоя.</div>';
  }

  /* у базы данных прогноза стоимости в интерфейсе нет */
  return fields + (e.type === 'db' ? '' : priceBlock()) +
    '<div class="d-actions">' +
      '<button class="btn green" onclick="saveEntity(\'' + esc(e.id) + '\')">Сохранить</button>' +
      '<button class="btn white" onclick="setTab(\'overview\')">Отмена</button>' +
      '<button class="btn danger" onclick="openDelete(\'' + esc(e.id) + '\')">Удалить</button>' +
    '</div>';
}

function cfgPicker(list, currentId, fn, isContainer) {
  return '<div class="cfg-grid">' + list.map(function (c) {
    const spec = isContainer
      ? 'vCPU ' + c.vcpu + ' · RAM ' + ramLabel(c.ram)
      : 'vCPU ' + c.vcpu + ' · RAM ' + c.ram + ' ГБ · SSD ' + c.ssd + ' ГБ';
    return '<div class="cfg' + (currentId === c.id ? ' active' : '') + '" data-cfg="' + c.id + '" onclick="' + fn + '(\'' + c.id + '\')">' +
      '<div class="cfg-name">' + esc(c.name) + (c.tag ? '<span class="cfg-tag">' + esc(c.tag) + '</span>' : '') + '</div>' +
      '<div class="cfg-desc">' + esc(c.desc) + '</div>' +
      '<div class="cfg-spec">' + spec + '</div>' +
      (isContainer ? '<div class="cfg-cost">' + fmt(containerCost(c)) + ' / реплика</div>' : '') +
    '</div>';
  }).join('') + '</div>';
}

function refreshPrice() {
  const box = $('price-box');
  if (box) box.innerHTML = priceBlockInner();
}

function highlightCfg(id) {
  const grid = document.querySelector('#drawer .cfg-grid');
  if (grid) Array.prototype.forEach.call(grid.querySelectorAll('.cfg'), function (el) {
    el.classList.toggle('active', el.getAttribute('data-cfg') === id);
  });
  refreshPrice();
}

function pickDbConfig(id) { st.draftDbConfig = id; highlightCfg(id); }
function pickRedisConfig(id) { st.draftRedisConfig = id; highlightCfg(id); }

function setDraft(field, v) {
  st[field] = parseInt(v, 10) || 0;
  refreshPrice();
}

function draftSteps(v) {
  const n = parseInt(v, 10);
  st.draftSteps = n > 0 ? Math.min(50, n) : 1;
  refreshPrice();
}

function diskStepper(field, step, max) {
  const v = st[field] || 0;
  return '<div class="repl-ctl" style="max-width:230px">' +
    '<button class="btn" onclick="bumpDisk(\'' + field + '\',' + (-step) + ',10,' + max + ')">−</button>' +
    '<span class="val" id="f-' + field + '">' + num(v) + '</span>' +
    '<button class="btn" onclick="bumpDisk(\'' + field + '\',' + step + ',10,' + max + ')">+</button></div>';
}

function bumpDisk(field, d, min, max) {
  st[field] = Math.max(min, Math.min(max, (st[field] || 0) + d));
  const el = $('f-' + field);
  if (el) el.textContent = num(st[field]);
  refreshPrice();
}

function selectStep(field, opts) {
  const v = st[field];
  return '<select class="in" id="f-' + field + '" onchange="setDraft(\'' + field + '\', this.value)">' + opts.map(function (o) {
    return '<option value="' + o + '"' + (o === v ? ' selected' : '') + '>' + num(o) + '</option>';
  }).join('') + '</select>';
}

/* git-провайдер выбирается только на шаге создания; после создания репозиторий заблокирован */
function setSource(s) {
  st.draftRepoSource = s;
  st.draftSource = s;
  if (st.creating) renderCreate(); else renderDrawer();
}

function selType() { const e = byId(st.selected); return e ? e.type : 'service'; }

function priceHead(total, note) {
  return '<div class="price-top-row"><span>Итого в месяц</span><span class="muted">без НДС</span></div>' +
    '<div class="price-total">' + fmt(total) + '</div>' +
    '<div class="price-note">' + I.info + '<span>Стоимость зависит от потребления</span></div>' +
    (note ? '<div class="info">' + I.info + '<span>' + note + '</span></div>' : '');
}

function pblock(title, tag, rows, total) {
  return '<div class="pblock"><div class="phead"><span>' + esc(title) + '</span>' +
      (tag ? '<span class="ptag">' + esc(tag) + '</span>' : '') + '</div>' +
    rows.map(function (r) {
      return '<div class="pline"><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>';
    }).join('') +
    '<div class="pcost">Стоимость: ' + fmt(total) + '</div></div>';
}

function priceBlockInner() {
  const t = selType();
  if (t === 'redis') return redisPriceInner();
  if (t === 's3') return s3PriceInner();
  if (t === 'workflow') return wfPriceInner();
  if (t === 'pipeline') return pipelinePriceInner();
  return servicePriceInner();
}

function pipelinePriceInner() {
  const e = byId(st.selected);
  const steps = st.draftSteps || (e ? e.steps : 3) || 3;
  const total = pipelineCost(steps);
  return '<div class="price-top-row"><span>Стоимость запуска</span><span class="muted">без НДС</span></div>' +
    '<div class="price-total">' + fmt(total) + '</div>' +
    '<div class="price-note">' + I.info + '<span>Разовый запуск сценария деплоя</span></div>' +
    pblock('Pipeline', '', [
      ['Шагов в сценарии', String(steps)],
      ['Шаг деплоя', fmt(RATES.container.step)]
    ], total);
}

function servicePriceInner() {
  const vcpu = typeof st.draftVcpu === 'number' ? st.draftVcpu : 0.1;
  const ramMb = typeof st.draftRamMb === 'number' ? st.draftRamMb : 256;
  const reps = typeof st.draftReplicas === 'number' ? st.draftReplicas : 1;
  const cpu = vcpu * RATES.container.vcpu * HOURS;
  const ram = (ramMb / 1024) * RATES.container.ram * HOURS;
  const per = cpu + ram;
  const fixed = DEPLOY_COST + ARTIFACT_COST + REPO_COST;
  const total = fixed + per * reps;
  return '<div class="price-top-row"><span>Итого в месяц</span><span class="muted">без НДС</span></div>' +
    '<div class="price-total">' + fmt(total) + '</div>' +
    '<div class="price-note">' + I.info + '<span>Стоимость зависит от потребления</span></div>' +
    '<div class="info">' + I.info + '<span>Container Apps умножается на количество реплик (' + reps + ').</span></div>' +
    pblock('Workflow Studio', '', [['Деплой', '1 шаг · ' + fmt(DEPLOY_COST)]], DEPLOY_COST) +
    pblock('Container Apps', '', [
      ['Конфигурация', cpuText(vcpu) + ' vCPU · ' + ramText(ramMb)],
      ['vCPU ' + cpuText(vcpu), fmt(cpu)],
      ['RAM ' + ramText(ramMb), fmt(ram)],
      ['Реплики', String(reps)]
    ], per) +
    pblock('Artifact Registry', 'Базовый', [
      ['Хранение 1 ГБ', fmt(RATES.container.artifactStore * HOURS)],
      ['Скачивание 1 ГБ', rate(RATES.container.artifactEgress)]
    ], ARTIFACT_COST) +
    pblock('Репо', '', [
      ['Хранение данных 1 ГБ', fmt(RATES.container.repoStore * HOURS)],
      ['Скачивание данных 1 ГБ', rate(RATES.container.repoEgress)]
    ], REPO_COST);
}

function redisPriceInner() {
  const c = pickById(REDIS_CONFIGS, st.draftRedisConfig);
  const disk = typeof st.draftRedisDisk === 'number' ? st.draftRedisDisk : c.ssd;
  const x = redisCost(c, disk);
  return priceHead(x.total, 'Managed Redis: vCPU, RAM и SSD тарифицируются по часам (приложение №7.EVO.16).') +
    pblock('Managed Redis', c.name, [
      ['vCPU ' + c.vcpu + ' × ' + rate(RATES.redis.vcpu) + '/час', fmt(x.cpu)],
      ['RAM ' + c.ram + ' ГБ × ' + rate(RATES.redis.ram) + '/ГБ·час', fmt(x.ram)],
      ['SSD ' + num(disk) + ' ГБ × ' + rate(RATES.redis.ssd) + '/ГБ·час', fmt(x.ssd)]
    ], x.total);
}

function s3PriceInner() {
  const o = {
    storage: typeof st.draftS3Storage === 'number' ? st.draftS3Storage : 100,
    read: typeof st.draftS3Read === 'number' ? st.draftS3Read : 1000,
    write: typeof st.draftS3Write === 'number' ? st.draftS3Write : 100,
    egress: typeof st.draftS3Egress === 'number' ? st.draftS3Egress : 100
  };
  const x = s3Cost(o);
  return priceHead(x.total, 'Object Storage: хранение, операции и исходящий трафик (приложение №7.EVO.3). Конфигурации vCPU/RAM у S3 нет.') +
    pblock('Object Storage', '', [
      ['Хранение ' + num(o.storage) + ' ГБ × ' + rate(RATES.s3.storage), fmt(x.storage)],
      ['Чтение ' + num(o.read) + ' тыс. × ' + rate(RATES.s3.read), fmt(x.read)],
      ['Запись ' + num(o.write) + ' тыс. × ' + rate(RATES.s3.write), fmt(x.write)],
      ['Плюс трафик ' + num(o.egress) + ' ГБ × ' + rate(RATES.s3.egress), fmt(x.egress)]
    ], x.total);
}

function wfPriceInner() {
  const e = byId(st.selected);
  const steps = st.draftSteps || (e ? e.steps : 3) || 3;
  const runs = typeof st.draftWfRuns === 'number' ? st.draftWfRuns : 1000;
  const x = wfCost(steps, runs);
  return priceHead(x.total, 'Workflow Studio: тариф за запуск шага (приложение №7.EVO.34), считается по фактическим запускам.') +
    pblock('Workflow Studio', '', [
      ['Запуск шага', fmt(RATES.workflow.step)],
      ['Шагов в сценарии', String(steps)],
      ['Запусков в месяц', num(runs)]
    ], x.total);
}

function priceBlock() {
  return '<label class="f">Прогноз стоимости</label><div class="price" id="price-box">' + priceBlockInner() + '</div>';
}

function saveEntity(id, silent) {
  const e = byId(id); if (!e) return;
  const nameEl = $('f-name');
  const name = nameEl ? nameEl.value.trim() : e.name;
  if (!name) { toast('Укажите название'); return; }
  e.name = name;
  if (e.type === 'service') {
    /* репозиторий после создания не редактируется — берём только то, что можно менять */
    const brEl = $('f-branch'); if (brEl) e.branch = brEl.value;
    const portEl = $('f-port'); if (portEl) { const p = parseInt(portEl.value, 10); if (p > 0) e.port = p; }
    /* одно значение реплик: бэк отправляет его и как минимум, и как максимум */
    e.replicas = Math.max(1, Math.min(10, typeof st.draftReplicas === 'number' ? st.draftReplicas : repCount(e)));
    e.replicasMin = e.replicas;
    e.replicasMax = e.replicas;
    if (typeof st.draftVcpu === 'number') e.vcpu = st.draftVcpu;
    if (typeof st.draftRamMb === 'number') e.ramMb = st.draftRamMb;
  }
  if (e.type === 'workflow') {
    const d = $('f-desc'); if (d) e.description = d.value;
    const s = $('f-steps'); if (s) { const n = parseInt(s.value, 10); if (n > 0) e.steps = n; }
    else if (st.draftSteps) e.steps = st.draftSteps;
    if (typeof st.draftWfRuns === 'number') e.wfRuns = st.draftWfRuns;
  }
  if (e.type === 'pipeline') {
    const brEl = $('f-branch'); if (brEl) e.branch = brEl.value;
    const sEl = $('f-steps');
    if (sEl) { const n = parseInt(sEl.value, 10); if (n > 0) e.steps = Math.min(50, n); }
    else if (st.draftSteps) e.steps = st.draftSteps;
  }
  if (e.type === 'db') {
    /* у базы данных в настройках только название */
  }
  if (e.type === 'redis') {
    if (st.draftRedisConfig) e.redisConfig = st.draftRedisConfig;
    e.redisDisk = Math.max(10, Math.min(500, st.draftRedisDisk || e.redisDisk || 20));
  }
  if (e.type === 's3') {
    const r = $('f-region'); if (r) e.region = r.value;
    if (typeof st.draftS3Storage === 'number') e.s3Storage = st.draftS3Storage;
    if (typeof st.draftS3Read === 'number') e.s3Read = st.draftS3Read;
    if (typeof st.draftS3Write === 'number') e.s3Write = st.draftS3Write;
    if (typeof st.draftS3Egress === 'number') e.s3Egress = st.draftS3Egress;
  }
  saveSpaces();
  render();
  if (!silent) toast('Настройки сохранены');
}

/* Деплой запускается только по кнопке: создание само ничего не разворачивает. */
function deployEntity(id) {
  const e = byId(id); if (!e) return;
  saveEntity(id, true);
  const x = byId(id); if (x) startDeploy(x, 'deploy');
}

/* ---------- деплои и логи (для сервиса) ---------- */
/* до первого деплоя сущности ещё нет — вкладки показывают только пустое состояние */
function emptyTab(title, text, actionLabel, actionJs) {
  return '<div class="empty-tab"><span class="ico">' + I.clock + '</span>' +
    '<b>' + esc(title) + '</b><span>' + esc(text) + '</span>' +
    (actionLabel ? '<button class="btn green sm" onclick="' + actionJs + '">' + esc(actionLabel) + '</button>' : '') +
    '</div>';
}

/* деплои сервиса: у активного — «Остановить», у деплоя в очереди — «Отменить» */
function deploysOf(e) {
  if (!Array.isArray(e.deploys)) {
    const created = e.created instanceof Date ? e.created : new Date(e.created || Date.now());
    e.deploys = [
      { run: '#1842', branch: e.branch || 'main', status: 'running', at: new Date(), dur: '1 мин 12 с' },
      { run: '#1841', branch: e.branch || 'main', status: 'queued', at: new Date(), dur: '—' },
      { run: '#1811', branch: e.branch || 'main', status: 'ok', at: new Date(created.getTime() - 2 * DAY), dur: '1 мин 04 с' },
      { run: '#1798', branch: e.branch || 'main', status: 'err', at: new Date(created.getTime() - 5 * DAY), dur: '48 с' }
    ];
  }
  return e.deploys;
}

function deployActionCell(e, d) {
  const id = esc(e.id), run = esc(d.run);
  if (d.status === 'running') {
    return '<button class="btn white sm" onclick="stopDeploy(\'' + id + '\',\'' + run + '\')">Остановить</button>';
  }
  if (d.status === 'queued') {
    return '<button class="btn white sm" onclick="stopDeploy(\'' + id + '\',\'' + run + '\')">Отменить</button>';
  }
  if (d.status === 'cancelled') {
    return '<button class="btn white sm" disabled title="Деплой уже остановлен">Отменён</button>';
  }
  return '<button class="btn white sm" disabled title="Деплой уже завершён">Остановить</button>';
}

function stopDeploy(id, run) {
  const e = byId(id); if (!e) return;
  const d = deploysOf(e).filter(function (x) { return x.run === run; })[0];
  if (!d || (d.status !== 'running' && d.status !== 'queued')) return;
  const wasRunning = d.status === 'running';
  d.status = 'cancelled';
  d.dur = wasRunning ? 'остановлен' : 'отменён';
  if (wasRunning && e.status === 'deploying') e.status = e.deployed ? 'ok' : 'new';
  e.updated = new Date();
  saveSpaces();
  render();
  toast('Деплой ' + run + (wasRunning ? ' остановлен' : ' отменён'));
}

function tabDeploys(e) {
  if (!isDeployed(e)) {
    return '<div class="section"><h4>Деплои</h4>' +
      emptyTab('Пока нет активных деплоев',
        'Данные появятся после первого деплоя. Запустите его кнопкой «Задеплоить» на вкладке «Обзор».',
        'Задеплоить', "deployEntity('" + esc(e.id) + "')") +
      '</div>';
  }
  const rows = deploysOf(e);
  return '<div class="section"><h4>История деплоев</h4>' +
    '<table class="hist"><thead><tr><th>Run</th><th>Ветка</th><th>Статус</th><th>Дата</th><th>Длительность</th><th></th></tr></thead><tbody>' +
    rows.map(function (d) {
      return '<tr><td class="mono">' + esc(d.run) + '</td><td>' + esc(d.branch) + '</td><td>' + statusBadge(d.status) + '</td>' +
        '<td>' + esc(absTime(new Date(d.at))) + '</td><td>' + esc(d.dur) + '</td><td>' + deployActionCell(e, d) + '</td></tr>';
    }).join('') +
    '</tbody></table>' +
    '<div class="hint-text">Активный деплой можно остановить, деплой в очереди — отменить. Кнопка неактивна у завершённых прогонов.</div></div>';
}

function tabLogs(e) {
  if (!isDeployed(e)) {
    return '<div class="section"><h4>Логи</h4>' +
      emptyTab('Логов пока нет', 'Логи появятся после первого деплоя.',
        'Задеплоить', "deployEntity('" + esc(e.id) + "')") +
      '</div>';
  }
  const body = e.type === 'pipeline' ? pipelineLogs(e) : appLogs();
  return '<div class="section"><h4>Логи</h4>' +
    '<div class="logbox" id="user-logs">' + body + '</div></div>';
}

/* логи прогона pipeline: шаги сценария, а не логи приложения */
function pipelineLogs(e) {
  const steps = e.steps || 3;
  return '<div><span class="t">18:24:01</span> <span class="s">INFO</span>  run #1842 started · branch ' + esc(e.branch || 'main') + '</div>' +
    '<div><span class="t">18:24:03</span> <span class="s">INFO</span>  step 1/' + steps + ' checkout</div>' +
    '<div><span class="t">18:24:19</span> <span class="s">INFO</span>  step 2/' + steps + ' build image</div>' +
    '<div><span class="t">18:24:52</span> <span class="w">WARN</span>  cache miss, rebuilding layer</div>' +
    '<div><span class="t">18:25:06</span> <span class="s">INFO</span>  step 3/' + steps + ' push artifact · 128 МБ</div>' +
    '<div><span class="t">18:25:11</span> <span class="s">INFO</span>  run #1842 finished · 1 мин 10 с</div>';
}
function appLogs() {
  return '<div><span class="t">16:42:01</span> <span class="s">INFO</span>  server started on 0.0.0.0:8080</div>' +
    '<div><span class="t">16:42:02</span> <span class="s">INFO</span>  connected to db.internal:5432</div>' +
    '<div><span class="t">16:42:07</span> <span class="s">INFO</span>  GET / 200 12ms</div>' +
    '<div><span class="t">16:42:19</span> <span class="s">INFO</span>  POST /orders 201 48ms</div>' +
    '<div><span class="t">16:43:20</span> <span class="w">WARN</span>  slow query 812ms</div>' +
    '<div><span class="t">16:43:21</span> <span class="s">INFO</span>  retry scheduled: cache warmup</div>' +
    '<div><span class="t">16:44:02</span> <span class="e">ERROR</span>  GET /checkout 502 upstream timeout</div>' +
    '<div><span class="t">16:44:05</span> <span class="s">INFO</span>  GET / 200 9ms</div>';
}

/* ---------- настройки пространства: переименование, удаление, Runners ---------- */
function drawerSettings() {
  const sp = currentSpace();
  let project = '';
  if (sp) {
    project =
      '<div class="section"><h4>Пространство</h4><div class="box">' +
        '<label class="f" style="margin-top:0">Название</label>' +
        '<input class="in" id="sp-name" maxlength="80" value="' + esc(sp.name) + '" autocomplete="off">' +
        '<div class="d-actions" style="margin-top:10px"><button class="btn green sm" onclick="renameProject()">Сохранить название</button></div>' +
        '<div class="hint-text">Название видно в крошках и в списке пространств.</div>' +
      '</div></div>';
  } else {
    project =
      '<div class="section"><h4>Пространство</h4><div class="box">' +
        '<p style="margin:0;color:#5b6676;line-height:1.5">Пространство не выбран. Откройте пространство или нажмите шестерёнку на его карточке.</p>' +
      '</div></div>';
  }
  const danger = sp ?
      '<div class="section"><h4>Удаление пространства</h4><div class="box">' +
        '<div class="box-row"><span>Объектов в пространстве</span><span>' + sp.entities.length + '</span></div>' +
        '<label class="f">Введите название пространства для подтверждения</label>' +
        '<input class="in" id="sp-del" autocomplete="off" placeholder="' + esc(sp.name) + '" oninput="validateProjectDelete()">' +
        '<div class="d-actions" style="margin-top:10px"><button class="btn danger sm" id="sp-del-btn" disabled onclick="deleteProject()">Удалить пространство</button></div>' +
        '<div class="hint-text">Удаляются карточки пространства и связанные данные. Действие необратимо.</div>' +
      '</div></div>' : '';
  return '<div class="dr-head">' +
      '<div class="dr-title-row">' +
        '<div><h2 class="dr-title">Настройки пространства</h2><div class="dr-sub">' + esc(sp ? sp.name : 'Пространство и раннеры') + '</div></div>' +
        '<button class="modal-close" onclick="closeDrawer()" title="Закрыть">×</button>' +
      '</div>' +
    '</div>' +
    '<div class="dr-body">' +
      project +
      '<div class="section"><h4>Runners</h4><div class="box">' +
        '<div class="box-row"><span>Пул</span><span>worker-pool-2 · 2 vCPU · 4 GB</span></div>' +
        '<div class="box-row"><span>Статус</span><span>' + statusBadge('ok') + '</span></div>' +
        '<div class="box-row"><span>Баланс</span><span>83,34 ₽</span></div>' +
      '</div></div>' +
      danger +
    '</div>';
}

function openProjectSettings(id) {
  const sp = spaceById(id);
  if (!sp) return;
  st.currentSpaceId = id;
  st.selected = 'settings';
  st.tab = 'settings';
  renderDrawer();
  openDrawerEl();
}

function renameProject() {
  const sp = currentSpace();
  if (!sp) return;
  const inp = $('sp-name');
  const name = inp ? inp.value.trim() : '';
  if (!name) { toast('Укажите название пространства'); return; }
  sp.name = name;
  saveSpaces();
  render();
  toast('Пространство переименован');
}

function validateProjectDelete() {
  const sp = currentSpace();
  const inp = $('sp-del'), btn = $('sp-del-btn');
  if (!sp || !inp || !btn) return;
  btn.disabled = inp.value.trim() !== sp.name;
}

function deleteProject() {
  const sp = currentSpace();
  if (!sp) return;
  const name = sp.name;
  st.spaces = st.spaces.filter(function (s) { return s.id !== sp.id; });
  st.currentSpaceId = null;
  saveSpaces();
  closeDrawer(true);
  st.view = 'spaces';
  st.editorId = null;
  render();
  toast('Пространство «' + name + '» удалён');
}

/* =========================================================
   Клавиатура и клики
   ========================================================= */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (st.consKind) { closeConsumption(); return; }
  if (st.modal) { closeModal(); return; }
  if (st.creating) { cancelCreate(); return; }
  if (st.selected) closeDrawer();
});

/* =========================================================
   Старт
   ========================================================= */
loadPositions();
loadSpaces();
render();
</script>
</body></html>
