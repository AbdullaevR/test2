<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow Studio</title>
<style>
:root{
  --bg:#f1f3f7; --panel:#fff; --line:#e4e7ee; --line2:#eceff4;
  --text:#1b2733; --muted:#7c8798; --muted2:#98a2b3;
  --green:#12a05c; --green-d:#0d8a4d; --green-bg:#e4f6ec; --green-tx:#0f7c47;
  --red:#c8382c; --red-bg:#fde5e2; --amber-bg:#fff2d6; --amber-tx:#8a6100;
  --chip:#eef1f6; --chip-tx:#495468; --draft-bg:#eef1f6; --draft-tx:#5b6676;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit}
a{color:inherit}

/* top bar */
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:30}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.tb-right{display:flex;align-items:center;gap:14px;color:#5b6676}
.icon-btn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:#4b5666;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#f1f3f7}
.proj{display:inline-flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-size:14px;color:var(--text);padding:6px 8px;border-radius:8px}
.proj:hover{background:#f1f3f7}
.tb-sep{width:1px;height:24px;background:var(--line)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs .sep{color:#c3c9d4}
.crumbs .cur{color:var(--text)}
.balance{font-size:14px;color:#3f4a5a}
.avatar-top{width:34px;height:34px;border-radius:50%;background:#f3d7de;color:#8a4356;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

/* shell + rail */
.shell{display:flex;height:calc(100vh - 56px)}
.rail{width:64px;flex:0 0 64px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;z-index:20}
.rail-btn{width:42px;height:42px;border-radius:10px;border:0;background:none;color:#67707e;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.rail-btn:hover{background:#f1f3f7;color:#1b2733}
.rail-btn.on{background:#e8f6ee;color:var(--green-tx)}
.rail-sep{width:26px;height:1px;background:var(--line);margin:6px 0}
.rail-spacer{flex:1}
.rail-btn .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#1f2937;color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5}
.rail-btn:hover .tip{opacity:1}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.canvas-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 24px 14px;flex-wrap:wrap}
.canvas-head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.2px}
.canvas-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.head-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:4px}
.head-link{display:inline-flex;align-items:center;gap:6px;color:#55606f;font-size:13px;cursor:pointer;white-space:nowrap}
.head-link:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.green{background:var(--green);color:#fff}
.btn.green:hover{background:var(--green-d)}
.btn.white{background:#fff;color:#2c3644;border:1px solid #d5dae3}
.btn.white:hover{background:#f6f7f9}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f0cbc7}
.btn.danger:hover{background:#fdf2f0}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

/* canvas */
.canvas-wrap{position:relative;flex:1;margin:0 24px 24px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background-image:radial-gradient(#d5d8de 1px,transparent 1px);background-size:20px 20px;min-height:420px}
.canvas-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.big-plus{width:62px;height:62px;border-radius:50%;border:1.5px dashed #c6cedb;background:#fff;color:#8a95a5;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,color .15s,transform .15s}
.big-plus:hover{border-color:var(--green);color:var(--green);transform:scale(1.04)}
.canvas-empty h3{margin:6px 0 0;font-size:17px;font-weight:600}
.canvas-empty p{margin:0;color:var(--muted);font-size:13.5px;max-width:360px;line-height:1.5}
.link-primary{color:var(--green-tx);font-size:13px;cursor:pointer;text-decoration:none;border-bottom:1px dashed #bfe3d0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;cursor:grab;transition:box-shadow .15s,border-color .15s;overflow:hidden;user-select:none;box-shadow:0 2px 8px rgba(20,30,50,.06)}
.card:hover{border-color:#cfd6e2;box-shadow:0 8px 22px rgba(20,30,50,.10)}
.card.dragging{cursor:grabbing;box-shadow:0 14px 34px rgba(20,30,50,.20);border-color:var(--green);z-index:10}
.card.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,160,92,.14)}
.card:focus{outline:2px solid var(--green);outline-offset:2px}
.card{position:absolute;width:272px}
.card-head{display:flex;align-items:flex-start;gap:10px;min-width:0}
.av{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#5b4450}
.card-titles{min-width:0;flex:1}
.card-title{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12.5px;margin-top:4px;min-width:0}
.card-sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-foot{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.card-repl{display:inline-flex;align-items:center;gap:2px;border:1px solid #dde3ec;border-radius:6px;padding:1px 2px;background:#fff}
.card-repl-btn{width:18px;height:18px;line-height:1;border:0;background:#f1f4f8;color:#3c4757;border-radius:4px;cursor:pointer;font-size:12px;padding:0}
.card-repl-btn:hover{background:#e3eaf3}
.card-repl-val{font-size:11.5px;font-weight:600;min-width:16px;text-align:center;color:#3c4757}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:500;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--green-bg);color:var(--green-tx)}
.badge.err{background:var(--red-bg);color:var(--red)}
.badge.warn{background:var(--amber-bg);color:var(--amber-tx)}
.badge.draft{background:var(--draft-bg);color:var(--draft-tx)}
.ago{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.type-chip{display:inline-flex;align-items:center;gap:5px;background:var(--chip);color:var(--chip-tx);border-radius:6px;padding:3px 8px;font-size:11.5px;max-width:100%;min-width:0;flex:0 1 auto}
.type-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.link-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* overlay (подтверждение удаления) */
.overlay{position:fixed;inset:0;background:rgba(23,29,38,.38);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px}
.modal-close{background:#f1f3f7;border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:#5b6676;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#e6e9ef}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(23,29,38,.26);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:690px;max-width:96vw;background:#fff;z-index:55;transform:translateX(102%);transition:transform .24s ease;display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(15,25,45,.18)}
.drawer.open{transform:translateX(0)}
.dr-head{padding:16px 22px 0;border-bottom:1px solid var(--line)}
.dr-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.dr-title{font-size:22px;font-weight:600;margin:0;letter-spacing:-.2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dr-sub{color:var(--muted);font-size:13px;margin-top:5px;word-break:break-all}
.dr-tabs{display:flex;gap:4px;margin-top:14px;flex-wrap:wrap}
.dr-tab{border:0;background:none;padding:9px 13px;font-size:13.5px;color:#5b6676;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dr-tab:hover{color:var(--text)}
.dr-tab.on{color:var(--green-tx);font-weight:600;border-bottom-color:var(--green)}
.dr-body{padding:18px 22px 28px;overflow:auto;flex:1}
.section{margin-bottom:20px}
.section h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.5px;color:#5b6677;text-transform:uppercase}
.drow{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed #e6e9ef}
.drow .dico{color:#93a0b1;display:flex}
.drow .dlabel{color:#6b7787}
.drow .dval{color:#1b2733;text-align:right;max-width:310px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dval.link{color:var(--green)}
.drow.actions{border-bottom:0;padding:8px 0 0}
.link-btn{background:none;border:0;color:var(--green);font-size:13px;cursor:pointer;padding:0 4px}
.link-btn:hover{text-decoration:underline}
.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12.5px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px}
.box-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.box-head b{font-size:14px}
.box-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;padding:4px 0;color:#495468}
.box-row span:first-child{color:#7c8798}
.hint-text{color:#8a95a5;font-size:12px;margin-top:8px;line-height:1.45}
.d-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cfg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cfg{border:1.5px solid #dfe4ec;border-radius:10px;padding:11px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s}
.cfg:hover{border-color:#c3ccda}
.cfg.active{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,160,92,.12)}
.cfg-name{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cfg-tag{background:var(--green-bg);color:var(--green-tx);font-size:10px;border-radius:4px;padding:1px 5px;font-weight:600}
.cfg-desc{color:var(--muted);font-size:11.5px;margin-top:4px;line-height:1.3}
.cfg-spec{color:#495468;font-size:12px;margin-top:7px}
.cfg-cost{font-weight:600;font-size:13px;margin-top:5px}
/* создание сервиса: репозиторий выбирается один раз и заблокирован после создания */
.locked{display:flex;align-items:center;gap:9px;background:#f4f6f9;border:1px solid #e2e6ee;border-radius:8px;padding:11px 13px;color:#5b6676;font-size:13.5px}
.locked .ico{color:#93a0b1;display:flex;flex:0 0 auto}
.locked .val{color:#3c4757;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.locked .tag{margin-left:auto;background:#e8ecf3;color:#5a6577;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap}
input.in:disabled,select.in:disabled{background:#f4f6f9;color:#8a95a5;cursor:not-allowed}
.empty-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;padding:44px 24px;border:1px dashed #dfe4ec;border-radius:12px;color:var(--muted)}
.empty-tab .ico{color:#b3bcc9;display:flex}
.empty-tab b{color:var(--text);font-size:14.5px}
.empty-tab span{font-size:13px;line-height:1.45;max-width:320px}
.create-note{display:flex;gap:9px;background:#eef4fb;color:#2f5f8f;border-radius:8px;padding:10px 11px;font-size:12.5px;line-height:1.45;margin-bottom:18px}
.create-note svg{flex:0 0 15px;margin-top:1px}
/* модалка создания: по центру экрана, а не в дровере */
.create-modal{background:#fff;border-radius:16px;width:780px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,25,45,.28);overflow:hidden}
.create-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px 24px 0}
.create-modal-head h2{margin:0;font-size:21px;font-weight:600;letter-spacing:-.2px}
.create-modal-head p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
.create-modal-body{padding:18px 24px 24px;overflow:auto}
.create-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.create-tile{border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;background:#fff;text-align:left;transition:border-color .15s,box-shadow .15s}
.create-tile:hover{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,160,92,.10)}
.create-tile:focus{outline:2px solid var(--green);outline-offset:1px}
.create-tile .t-ico{width:34px;height:34px;border-radius:9px;background:#f1f3f7;display:flex;align-items:center;justify-content:center;color:#4b5666;margin-bottom:9px}
.create-tile b{display:block;font-size:13.5px}
.create-tile small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.3}
@media (max-width:760px){ .create-grid{grid-template-columns:1fr 1fr} }
label.f{display:block;font-size:13.5px;font-weight:600;color:#3c4757;margin:16px 0 7px}
label.f:first-child{margin-top:0}
input.in,select.in,textarea.in{width:100%;padding:11px 13px;border:1px solid #d8dde6;border-radius:8px;font-size:13.5px;color:var(--text);background:#fff;outline:none;font-family:inherit}
input.in:focus,select.in:focus,textarea.in:focus{border-color:#b9c2d0;box-shadow:0 0 0 3px #eef2f7}
textarea.in{resize:vertical;min-height:70px}
.counter{text-align:right;color:#9aa4b2;font-size:12px;margin-top:5px}
.info{display:flex;gap:9px;background:#eef4fb;color:#2f5f8f;border-radius:8px;padding:10px 11px;font-size:12.5px;margin-top:12px;line-height:1.45}
.info svg{flex:0 0 15px;margin-top:1px}
.note-warn{background:var(--amber-bg);color:var(--amber-tx)}
.note-err{background:var(--red-bg);color:var(--red)}
.tabs{display:inline-flex;background:#f1f3f7;border-radius:8px;padding:3px;gap:2px}
.tab{border:0;background:none;padding:7px 14px;border-radius:6px;font-size:13px;color:#5b6676;cursor:pointer}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(20,30,50,.12);font-weight:600}
.price{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.pill-free{display:inline-block;background:var(--green);color:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:600}
.price-top-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#3c4757;font-size:13.5px}
.price-top-row .muted{color:var(--muted2);font-size:12.5px}
.price-total{font-size:26px;font-weight:600;margin:3px 0 5px;letter-spacing:-.3px}
.price-note{display:flex;align-items:center;gap:7px;color:#6b7787;font-size:12.5px}
.price-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:12px 0 5px;font-size:13.5px;color:#2c3644;cursor:pointer}
.pblock{border:1px solid #e9ecf1;border-radius:8px;padding:10px;margin:8px 0}
.pblock .phead{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px;margin-bottom:6px}
.pblock .ptag{background:#eef1f6;color:#5a6577;font-size:11px;border-radius:5px;padding:1px 6px;font-weight:500}
.pline{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#6b7787;font-size:12.5px;padding:2px 0}
.pline span:last-child{color:#3c4757;white-space:nowrap}
.pcost{display:flex;justify-content:flex-end;font-size:12.5px;font-weight:600;color:#2c3644;margin-top:5px}
.port-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.port-row input.in{max-width:150px}
.hint-chip{background:#eef1f6;color:#5a6577;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:500}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th{text-align:left;color:#8a95a5;font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
table.hist td{padding:9px 8px;border-bottom:1px dashed #e9ecf1;color:#3c4757}
.logbox{background:#0a0c10;border:1px solid #1b2230;border-radius:10px;padding:14px;font-family:"Cascadia Mono",Consolas,monospace;font-size:11.5px;line-height:1.65;color:#c9d3e0;max-height:340px;overflow:auto}
.logbox .t{color:#6b7a8d}.logbox .w{color:#f0c674}.logbox .e{color:#ef8b80}.logbox .s{color:#7fd1a1}
.select-inline{padding:6px 9px;border:1px solid #dde1e8;border-radius:8px;font-size:12px;background:#fff;color:#3c4757}
.repl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.repl-cell{border:1px solid #e2e6ee;border-radius:10px;padding:10px 12px;background:#fff}
.repl-label{display:block;font-size:12.5px;color:#5b6676;margin-bottom:6px}
.repl-ctl{display:flex;align-items:center;gap:8px}
.repl-ctl .val{font-size:20px;font-weight:600;min-width:34px;text-align:center}
.repl-ctl .btn{width:30px;height:30px;padding:0;font-size:16px;border-radius:8px;background:#fff;border:1px solid #d5dae3;color:#3c4757}
.type-badge{display:inline-flex;align-items:center;gap:6px;background:#f1f3f7;color:#4b5666;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:600}

/* spaces list */
#spaces-view{display:none;flex:1;min-height:0;overflow:auto;padding:20px 24px 28px;flex-direction:column;gap:18px}
.spaces-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.spaces-head h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.2px}
.spaces-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.spaces-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;align-content:start}
.space-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:left;transition:border-color .15s,box-shadow .15s;box-shadow:0 2px 8px rgba(20,30,50,.06)}
.space-card:hover{border-color:#cfd6e2;box-shadow:0 8px 22px rgba(20,30,50,.10)}
.space-card:focus{outline:2px solid var(--green);outline-offset:2px}
.sc-top{display:flex;align-items:center;gap:10px;min-width:0}
.sc-ico{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:#e8f6ee;color:var(--green-tx);display:flex;align-items:center;justify-content:center}
.sc-name{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-meta{color:var(--muted);font-size:12.5px;margin-top:4px}
.sc-foot{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.sc-settings{margin-left:auto;background:#f1f3f7;border:0;width:30px;height:30px;border-radius:8px;color:#5b6676;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.sc-settings:hover{background:#e6e9ef;color:var(--text)}

function rate(n) { return n.toFixed(6).replace(/0+$/, '').replace(/\.$/, '').replace('.', ',') + ' ₽'; }
function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function pickById(list, id) { return list.filter(function (x) { return x.id === id; })[0] || list[1]; }
function configById(id) { return pickById(CONFIGS, id); }
function ramLabel(gb) { return gb < 1 ? Math.round(gb * 1024) + ' МБ' : gb + ' ГБ'; }

/* Сервис хранит контейнерный конфиг напрямую: vCPU и RAM в МБ (как в Container Apps).
   У ранее сохранённых сущностей есть только config id — читаем из него. */
function servVcpu(e) {
  if (e && typeof e.vcpu === 'number') return e.vcpu;
  return configById((e && e.config) || 'standard').vcpu;
}
function servRamMb(e) {
  if (e && typeof e.ramMb === 'number') return e.ramMb;
  return Math.round(configById((e && e.config) || 'standard').ram * 1024);
}
function servPerReplica(e) {
  return servVcpu(e) * RATES.container.vcpu * HOURS + (servRamMb(e) / 1024) * RATES.container.ram * HOURS;
}
function cpuText(v) { return String(Math.round(v * 100) / 100).replace('.', ','); }
function ramText(mb) {
  const v = Math.round(mb);
  return v >= 1024 ? (v / 1024).toFixed(v % 1024 ? 1 : 0).replace('.', ',') + ' ГБ' : v + ' МБ';
}
function containerCost(c) { return c.vcpu * RATES.container.vcpu * HOURS + c.ram * RATES.container.ram * HOURS; }
function dbCost(cfg, disk) {
  const cpu = cfg.vcpu * RATES.postgres.vcpu * HOURS;
  const ram = cfg.ram * RATES.postgres.ram * HOURS;
  const ssd = disk * RATES.postgres.ssd * HOURS;
  return { cpu: cpu, ram: ram, ssd: ssd, total: cpu + ram + ssd };
}
function redisCost(cfg, disk) {
  const cpu = cfg.vcpu * RATES.redis.vcpu * HOURS;
  const ram = cfg.ram * RATES.redis.ram * HOURS;
  const ssd = disk * RATES.redis.ssd * HOURS;
  return { cpu: cpu, ram: ram, ssd: ssd, total: cpu + ram + ssd };
}
function s3Cost(o) {
  const storage = o.storage * RATES.s3.storage;
  const read = (o.read / 1000) * RATES.s3.read;
  const write = (o.write / 1000) * RATES.s3.write;
  const egress = o.egress * RATES.s3.egress;
  return { storage: storage, read: read, write: write, egress: egress, total: storage + read + write + egress };
}
function wfCost(steps, runs) {
  const stepCost = RATES.workflow.step;
  return { stepCost: stepCost, runs: runs, steps: steps, total: steps * runs * stepCost };
}
/* Pipeline: разовый запуск сценария — по шагу деплоя (0,10 ₽) */
function pipelineCost(steps) {
  const n = typeof steps === 'number' && steps > 0 ? steps : 3;
  return n * RATES.container.step;
}
const DEPLOY_COST = RATES.container.step;
const ARTIFACT_COST = RATES.container.artifactStore * HOURS + RATES.container.artifactEgress;
const REPO_COST = RATES.container.repoStore * HOURS + RATES.container.repoEgress;
function totalFor(id) { return DEPLOY_COST + ARTIFACT_COST + REPO_COST + containerCost(configById(id)); }

const ENT = { '&': '\u0026amp;', '<': '\u0026lt;', '>': '\u0026gt;', '"': '\u0026quot;', "'": '\u0026#39;' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ENT[c]; }); }
function $(id) { return document.getElementById(id); }
function uid(p) { return (p || 'e') + Date.now().toString(36) + Math.floor(Math.random() * 1000); }

function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return few;
  return many;
}
function relTime(d) {
  const s = Math.max(0, Math.floor((Date.now() - d.getTime()) / 1000));
  if (s < 60) return 'только что';
  const m = Math.floor(s / 60); if (m < 60) return m + ' ' + plural(m, 'минуту', 'минуты', 'минут') + ' назад';
  const h = Math.floor(m / 60); if (h < 24) return h + ' ' + plural(h, 'час', 'часа', 'часов') + ' назад';
  const dd = Math.floor(h / 24); if (dd < 30) return dd + ' ' + plural(dd, 'день', 'дня', 'дней') + ' назад';
  const mm = Math.floor(dd / 30); if (mm < 12) return mm + ' ' + plural(mm, 'месяц', 'месяца', 'месяцев') + ' назад';
  const yy = Math.floor(mm / 12);
  return yy + ' ' + plural(yy, 'год', 'года', 'лет') + ' назад';
}
function absTime(d) {
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function slug(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'app'; }
function initials(name) { return esc(String(name).slice(0, 2).toUpperCase()); }
function byId(id) { return st.entities.filter(e => e.id === id)[0] || null; }
function domainOf(e) { return e.domain || ('https://' + slug(e.name) + '-' + (e.type === 'db' ? 'db' : 'app') + '.containerapps.ru'); }

let toastTimer = null;
function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function render() {
  if (st.view !== 'canvas' && st.selected && st.selected !== 'settings') closeDrawer(true);
  updateChrome();
  $('spaces-view').innerHTML = st.view === 'spaces' ? spacesHtml() : '';
  $('editor-view').innerHTML = st.view === 'editor' ? editorHtml() : '';
  if (st.view === 'canvas') renderCanvas();
  renderDrawer();
  renderCreate();
  renderConsumption();
  toggleViews();
}

/* слой модалки создания поверх канваса */
function renderCreate() {
  const root = $('create-root');
  if (!root) return;
  if (!st.creating) { root.innerHTML = ''; return; }
  root.innerHTML = createModalHtml();
}

function toggleViews() {
  $('spaces-view').style.display = st.view === 'spaces' ? 'flex' : 'none';
  $('canvas-view').style.display = st.view === 'canvas' ? 'flex' : 'none';
  $('editor-view').style.display = st.view === 'editor' ? 'block' : 'none';
}

function updateChrome() {
  const sp = currentSpace();
  const ed = st.view === 'editor' ? byId(st.editorId) : null;
  const name = st.view === 'spaces' ? 'Пространства' : st.view === 'editor' ? (ed ? ed.name : 'Сценарий') : (sp ? sp.name : 'Пространства');
  const proj = $('tb-space');
  if (proj && proj.childNodes.length) proj.childNodes[0].nodeValue = name + ' ';
  const crumb = $('crumb-cur');
  if (crumb) crumb.textContent = name;
  const title = $('space-title');
  if (title) title.textContent = sp ? sp.name : '—';
  const rs = $('rail-spaces');
  if (rs) rs.classList.toggle('on', true);
}

/* =========================================================
   Поповер «Потребление запусков»: Pipelines / Workflows / Services

const CONS_LIMIT = 50;
const CONS_USED = 6;
const CONS_RESET = '1 декабря 2026';

function consProgress() {
  const pct = Math.round(CONS_USED / CONS_LIMIT * 100);
  return '<div class="cons-usage"><span>Использовано <b>' + CONS_USED + '</b> из ' + CONS_LIMIT + ' шагов</span><span>' + pct + '%</span></div>' +
    '<div class="cons-bar"><span style="width:' + pct + '%"></span></div>';
}

function consRemaining() {
  const left = CONS_LIMIT - CONS_USED;
  return '<div class="cons-line"><span>Осталось ' + left + ' ' + plural(left, 'шаг', 'шага', 'шагов') + '</span>' +
    '<span class="date">Обновится ' + CONS_RESET + '</span></div>';
}

function consFreeBlock() {
  const pct = Math.round(CONS_USED / CONS_LIMIT * 100);
  return '<div class="cons-free-label">Бесплатные шаги</div>' +
    '<div class="cons-usage"><span>Доступно по тарифу</span><span>' + CONS_LIMIT + ' шагов</span></div>' +
    '<div class="cons-bar thin"><span style="width:' + pct + '%"></span></div>' +
    '<div class="cons-line"><span>Использовано ' + CONS_USED + ' из ' + CONS_LIMIT + '</span>' +
      '<span class="date">Обновится ' + CONS_RESET + '</span></div>';
}

function consWarn() {
  return '<div class="cons-warn">' + I.info + '<span>Сверх лимита — 0,10 ₽ / шаг</span></div>';
}

function consRunner() {
  const r = RUNNERS.filter(function (x) { return x.id === DEFAULT_RUNNER; })[0] || RUNNERS[0];
  return '<div class="cons-div"></div>' +
    '<div class="cons-runner-head"><div><div class="cons-free-label" style="margin:0 0 3px">Runner</div>' +
      '<div class="cons-runner-name">' + esc(r.name) + '</div></div>' +
      '<span class="hint-chip">Container Jobs</span></div>' +
    '<div class="cons-cards">' +
      '<div class="cons-card"><small>vCPU</small><b>4</b></div>' +
      '<div class="cons-card"><small>RAM</small><b>8 ГБ</b></div>' +
    '</div>' +
    '<div class="cons-foot">' +
      '<a class="link-primary" href="#" onclick="toast(\'Тарификация Runner — отдельная страница тарифов\');return false">Тарификация</a>' +
      '<button class="btn white sm" onclick="toast(\'Создание Runner — отдельный экран\')">Создать Runner</button>' +
    '</div>';
}

function consumptionPopover(kind) {
  let note = '', runner = '';
  if (kind === 'workflow') {
    note = '<div class="cons-note">Общий лимит шагов для всех сценариев.</div>';
  } else if (kind === 'services') {
    note = '<div class="cons-note">Один деплой сервиса состоит из нескольких шагов сборки и запуска. ' +
      'Лимит общий для Services, Pipelines и Workflows.</div>';
  } else {
    /* Pipelines: секция RUNNER и кнопка создания раннера остаются */
    runner = consRunner();
  }
  return '<div class="cons-pop" onclick="event.stopPropagation()">' +
      '<div class="cons-head"><span class="cons-title">Потребление запусков</span>' +
        '<button class="modal-close" style="width:28px;height:28px;font-size:16px" onclick="closeConsumption()" title="Закрыть">×</button></div>' +
      '<div class="cons-body">' +
        consProgress() + consRemaining() + consFreeBlock() + note + consWarn() + runner +
      '</div>' +
    '</div>';
}

function renderConsumption() {

function statusBadge(s) {

  if (s === 'queued') return '<span class="badge draft"><i class="dot"></i>В очереди</span>';
  if (s === 'cancelled') return '<span class="badge draft"><i class="dot"></i>Остановлен</span>';
  return '<span class="badge draft"><i class="dot"></i>Не задеплоен</span>';

/* до первого деплоя у сервиса нет ни логов, ни истории деплоев, ни домена */

function renderCanvas() {
  const cv = $('canvas');

      '</div>';

function defaultPos(i) { return { x: 24 + (i % 3) * 300, y: 24 + Math.floor(i / 3) * 150 }; }

function loadPositions() {
  try {
    const raw = localStorage.getItem(POS_KEY);
    if (raw) st.positions = JSON.parse(raw) || {};
  } catch (e) { st.positions = {}; }
  st.positionsLoaded = true;
}
function savePositions() {
  try { localStorage.setItem(POS_KEY, JSON.stringify(st.positions)); } catch (e) { }
}

function loadSpaces() {
  try {
    const raw = localStorage.getItem(SPACES_KEY);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    st.spaces = arr.map(function (sp) {
      return {
        id: sp.id, name: sp.name, created: new Date(sp.created),
        entities: (sp.entities || []).map(function (e) { e.created = new Date(e.created); return e; })
      };
    });
  } catch (e) { st.spaces = []; }
}
function saveSpaces() {
  try { localStorage.setItem(SPACES_KEY, JSON.stringify(st.spaces)); } catch (e) { }
}

function bindDrag() {
  const cv = $('canvas');
  if (!cv) return;
  Array.prototype.forEach.call(cv.querySelectorAll('.card'), function (card) {
    card.addEventListener('mousedown', function (ev) {
      if (ev.button !== 0) return;
      const id = card.getAttribute('data-id');
      const startX = ev.clientX, startY = ev.clientY;
      const baseX = parseInt(card.style.left, 10) || 0, baseY = parseInt(card.style.top, 10) || 0;
      let moved = false;
      card.classList.add('dragging');
      function onMove(e) {
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        card.style.left = Math.max(0, baseX + dx) + 'px';
        card.style.top = Math.max(0, baseY + dy) + 'px';
        drawLinks();
      }
      function onUp() {
        card.classList.remove('dragging');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        const e = byId(id);
        if (e) {
          e.x = parseInt(card.style.left, 10) || 0;
          e.y = parseInt(card.style.top, 10) || 0;
          st.positions[id] = { x: e.x, y: e.y };
          savePositions();
        }
        if (!moved) openEntity(id);
        else renderCanvas();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      ev.preventDefault();
    });
  });
}

/* линии связи между сущностями не рисуем: фронту не приходят данные о привязках БД к сервису */

/* =========================================================

   ========================================================= */
const REPOS = ['mockup_ws', 'code-683742', 'game-ridiculous'];
const REPO_SOURCES = ['Repo', 'Gitverse', 'URL'];

function openAdd() { openCreate(); }

/* карточка появляется только после «Создать»: закрыли модалку — на канвасе ничего нет */
function openCreate() {
  st.creating = true;
  st.createType = null;

  st.draftRamMb = 256;
  st.draftSteps = 3;
  st.draftWfRuns = 1000;
  st.draftDbConfig = 'db-m';
  st.draftDbDisk = 50;
  st.draftRedisConfig = 'rd-m';
  st.draftRedisDisk = 20;
  st.draftS3Storage = 100;
  st.draftS3Read = 1000;
  st.draftS3Write = 100;

}

function cancelCreate() {
  st.creating = false;
  st.createType = null;
  renderCreate();
}

function createTypeOf(t) { return CREATE_TYPES.filter(function (x) { return x.type === t; })[0] || null; }

/* шаг 1 → шаг 2: тип выбран, подставляем имя по умолчанию.
   Workflow — исключение: у него нет формы, сразу открываем его канвас. */
function pickCreateType(t) {
  const meta = createTypeOf(t);
  if (!meta) return;
  if (t === 'workflow') { createWorkflowNow(); return; }
  st.createType = t;
  st.draftName = defaultCreateName(t);
  st.draftDesc = '';
  renderCreate();
  setTimeout(function () {
    const el = $('f-repo') || $('f-name');
    if (el && el.focus) el.focus();
  }, 40);
}

function wfSuffix() { return Math.random().toString(16).slice(2, 8).padEnd(6, '0'); }

/* workflow создаётся сразу и открывается его сценарий — без промежуточной формы */
function createWorkflowNow() {
  const pos = defaultPos(st.entities.length);
  const e = {
    id: uid('e'), type: 'workflow', name: 'workflow-' + wfSuffix(),
    status: 'ok', deployed: true, created: new Date(), updated: new Date(),
    steps: 3, description: '', wfRuns: 1000, runner: DEFAULT_RUNNER,
    x: pos.x, y: pos.y
  };
  st.entities.push(e);
  st.positions[e.id] = { x: pos.x, y: pos.y };
  savePositions();
  saveSpaces();
  st.creating = false;
  st.createType = null;
  st.selected = null;
  openEditor(e.id, 'scenario');
  toast('Workflow «' + e.name + '» создан — сценарий открыт');
}

function backToTypePicker() { st.createType = null; renderCreate(); }

function defaultCreateName(t) {
  const n = st.entities.filter(function (x) { return x.type === t; }).length + 1;
  if (t === 'db') return 'postgres-' + n;
  if (t === 'redis') return 'cache-' + n;
  if (t === 's3') return 'bucket-' + n;
  if (t === 'workflow') return 'workflow-' + n;
  if (t === 'pipeline') return 'pipeline-' + n;
  return 'service-' + n;
}

function draftRepoInput(v) { st.draftRepo = v; }

function repoOptions() {
  const list = REPOS.slice();
  if (st.draftRepo && list.indexOf(st.draftRepo) === -1) list.unshift(st.draftRepo);
  return '<option value="">Не выбран</option>' + list.map(function (r) {
    return '<option' + (st.draftRepo === r ? ' selected' : '') + '>' + esc(r) + '</option>';
  }).join('');
}

/* имя сервиса генерируется из репозитория, отдельного поля названия нет */
function repoServiceName(repo) {
  const tail = String(repo || '').replace(/\/+$/, '').split('/').pop().replace(/\.git$/i, '');
  return slug(tail);
}

/* единый перенос значений из сущности в поля формы */
function syncDrafts(e) {
  if (!e) return;
  /* при открытии другой карточки черновик переменных не переносим */
  st.draftVars = null;
  st.draftConfig = e.config || 'standard';
  st.draftSource = e.repoSource || 'Repo';
  st.draftVcpu = servVcpu(e);
  st.draftRamMb = servRamMb(e);
  st.draftReplicas = repCount(e);
  st.draftSteps = typeof e.steps === 'number' ? e.steps : 3;
  st.draftDbConfig = e.dbConfig || 'db-m';
  st.draftDbDisk = typeof e.dbDisk === 'number' ? e.dbDisk : 50;
  st.draftRedisConfig = e.redisConfig || 'rd-m';
  st.draftRedisDisk = typeof e.redisDisk === 'number' ? e.redisDisk : 20;
  st.draftS3Storage = typeof e.s3Storage === 'number' ? e.s3Storage : 100;
  st.draftS3Read = typeof e.s3Read === 'number' ? e.s3Read : 1000;
  st.draftS3Write = typeof e.s3Write === 'number' ? e.s3Write : 100;
  st.draftS3Egress = typeof e.s3Egress === 'number' ? e.s3Egress : 100;
  st.draftWfRuns = typeof e.wfRuns === 'number' ? e.wfRuns : 1000;
  st.draftBranch = e.branch || 'main';
  st.draftPort = e.port || 8080;
  st.draftRunner = e.runner || DEFAULT_RUNNER;
}

/* создание из формы дровера: у сервиса имя из репозитория, у остальных — из поля «Название» */
function createFromDraft() {
  const t = st.createType;
  if (!t) return;
  const pos = defaultPos(st.entities.length);
  const e = {
    id: uid('e'), type: t, name: '', status: 'ok', deployed: false, created: new Date(),
    replicas: 1,
    vcpu: st.draftVcpu, ramMb: st.draftRamMb, port: 8080,
    dbConfig: st.draftDbConfig || 'db-m', dbDisk: st.draftDbDisk || 50,
    redisConfig: st.draftRedisConfig || 'rd-m', redisDisk: st.draftRedisDisk || 20,
    s3Storage: st.draftS3Storage || 100, s3Read: st.draftS3Read || 1000,
    s3Write: st.draftS3Write || 100, s3Egress: st.draftS3Egress || 100,
    wfRuns: st.draftWfRuns || 1000, steps: st.draftSteps || 3,
    repoSource: st.draftRepoSource, repo: '', branch: st.draftBranch || 'main',
    description: '', region: 'ru-central-1', pw: 1,
    runner: DEFAULT_RUNNER,
    x: pos.x, y: pos.y
  };
  /* сервис сначала не развёрнут, остальные (включая сценарии) готовы сразу */
  if (t === 'service') { e.status = 'new'; e.deployed = false; }
  if (t === 'db') e.port = 5432;
  if (t === 'redis') e.port = 6379;

  if (t === 'service') {
    const el = $('f-repo');
    const repo = (el ? el.value : st.draftRepo || '').trim();
    if (!repo) { toast('Выберите репозиторий'); return; }
    st.draftRepo = repo;
    e.repo = repo;
    e.name = repoServiceName(repo);
  } else {
    const nameEl = $('f-name');
    const name = (nameEl ? nameEl.value : st.draftName || '').trim();
    if (!name) { toast('Укажите название'); return; }
    e.name = name;
    const descEl = $('f-desc'); if (descEl) e.description = descEl.value.trim();
    const brEl = $('f-branch'); if (brEl) e.branch = brEl.value;
  }

  st.entities.push(e);
  st.positions[e.id] = { x: pos.x, y: pos.y };
  savePositions();
  saveSpaces();
  st.creating = false;

/* сохранение вкладки и передеплой после подтверждения */
function confirmRedeploy() {
  const m = st.modal;
  const e = m ? byId(m.id) : null;
  if (!m || !e) return;
  if (m.tab === 'vars') {
    const err = applyVarsDraft(e);
    if (err) { closeModal(); toast(err); return; }
    st.draftVars = e.vars.map(function (v) { return { name: v.name, value: v.value, secret: !!v.secret }; });
  } else {
    saveEntity(e.id, true);
  }
  closeModal();
  const x = byId(e.id);
  if (x) startDeploy(x, m.tab === 'vars' ? 'vars' : 'settings');

/* единый запуск деплоя из кнопки и после сохранения */
function startDeploy(e, source) {
  e.updated = new Date();
  e.status = 'deploying';
  const list = deploysOf(e);
  const runNo = '#' + (1842 + list.length + 1);
  list.unshift({ run: runNo, branch: e.branch || 'main', status: 'running', at: new Date(), dur: '—' });
  saveSpaces();
  render();
  toast(source === 'deploy'
    ? 'Деплой запущен — логи и история появятся во вкладках «Деплои» и «Логи»'
    : source === 'vars'
      ? 'Переменные сохранены — сервис передеплоивается'
      : 'Настройки сохранены — сервис передеплоивается');
  const id = e.id, run = runNo;
  setTimeout(function () {
    const x = byId(id); if (!x) return;
    const d = (x.deploys || []).filter(function (r) { return r.run === run; })[0];
    if (!d || d.status !== 'running') return;
    d.status = 'ok'; d.dur = '1 мин 12 с';
    x.status = 'ok'; x.deployed = true; x.deployedAt = new Date();
    saveSpaces();
    render();
    toast('«' + x.name + '» задеплоен');
  }, 2500);
}
function validateDelete() {
  const inp = $('del-name'), b = $('del-btn');
  const e = st.modal ? byId(st.modal.id) : null;
  if (!inp || !b || !e) return;
  b.disabled = inp.value !== e.name;
}
function doDelete() {
  const e = st.modal ? byId(st.modal.id) : null;
  if (!e) return;
  st.entities = st.entities.filter(x => x.id !== e.id);
  delete st.positions[e.id];
  savePositions();
  saveSpaces();
  if (st.selected === e.id) closeDrawer(true);
  closeModal();
  render();
  toast('«' + e.name + '» удалён');
}

/* ---------- переменные сервиса (AICW-7622) ---------- */
function varsOf(e) {
  if (!e.vars) e.vars = [
    { name: 'DB_HOST', value: 'db.internal', secret: false },
    { name: 'DB_PASSWORD', value: 's3cret', secret: true }
  ];
  return e.vars;
}
/* черновик таблицы переменных: изменения копятся до общей кнопки «Сохранить» */
function varsDraft(e) {
  if (!Array.isArray(st.draftVars)) {
    st.draftVars = varsOf(e).map(function (v) {
      return { name: v.name, value: v.value, secret: !!v.secret };
    });
  }
  return st.draftVars;
}

function tabVars(e) {
  const id = esc(e.id);
  const list = varsDraft(e);
  const rows = list.length
    ? '<div class="var-table">' + list.map(function (v, i) {
        return '<div class="var-edit">' +
          '<input class="nm" value="' + esc(v.name) + '" placeholder="NAME" autocomplete="off" ' +
            'oninput="updVar(\'name\',' + i + ',this.value)">' +
          '<input type="' + (v.secret ? 'password' : 'text') + '" value="' + esc(v.value) + '" placeholder="Значение" ' +
            'autocomplete="off" oninput="updVar(\'value\',' + i + ',this.value)">' +
          '<select onchange="updVar(\'secret\',' + i + ',this.value)">' +
            '<option value="0"' + (v.secret ? '' : ' selected') + '>Открытая</option>' +
            '<option value="1"' + (v.secret ? ' selected' : '') + '>Секрет</option>' +
          '</select>' +
          '<button class="icon-btn" title="Удалить строку" onclick="delVarDraft(' + i + ')">×</button>' +
        '</div>';
      }).join('') + '</div>'
    : '<div class="var-empty">Переменных пока нет — добавьте первую строку.</div>';
  return '<div class="section"><h4>Переменные</h4><div class="box">' +
      rows +
      '<div class="var-err" id="verr"></div>' +
      '<div class="d-actions" style="margin-top:12px">' +
        '<button class="btn white sm" onclick="addVarDraft()">Добавить переменную</button>' +
      '</div>' +
      '<div class="hint-text">Добавляйте, редактируйте и удаляйте строки в таблице: изменения применятся одной кнопкой «Сохранить» внизу вкладки.</div>' +
    '</div></div>' +
    '<div class="d-actions">' +
      '<button class="btn green" onclick="openRedeployConfirm(\'vars\')">Сохранить</button>' +
      '<button class="btn white" onclick="resetVarsDraft(\'' + id + '\')">Отмена</button>' +
    '</div>';
}

function updVar(field, i, val) {
  if (!Array.isArray(st.draftVars) || !st.draftVars[i]) return;
  if (field === 'secret') st.draftVars[i].secret = val === '1';
  else st.draftVars[i][field] = val;
}

function addVarDraft() {
  if (!Array.isArray(st.draftVars)) st.draftVars = [];
  st.draftVars.push({ name: '', value: '', secret: false });
  renderDrawer();
}

function delVarDraft(i) {
  if (!Array.isArray(st.draftVars)) return;
  st.draftVars.splice(i, 1);
  renderDrawer();
}

function resetVarsDraft(id) {
  const e = byId(id);
  st.draftVars = e ? varsOf(e).map(function (v) {
    return { name: v.name, value: v.value, secret: !!v.secret };
  }) : [];
  renderDrawer();
  toast('Изменения переменных отменены');
}

function validateVarsDraft() {
  const list = (st.draftVars || []).filter(function (v) { return v.name.trim() || v.value; });
  const seen = {};
  for (let i = 0; i < list.length; i++) {
    const n = list[i].name.trim();
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(n)) return 'Имя переменной «' + n + '»: латиница, цифры и _';
    if (/^WS_/i.test(n)) return 'Префикс WS_ зарезервирован системой';
    if (seen[n]) return 'Переменная ' + n + ' указана дважды';
    seen[n] = true;
  }
  return '';
}

function applyVarsDraft(e) {
  const err = validateVarsDraft();
  if (err) return err;
  e.vars = (st.draftVars || []).filter(function (v) { return v.name.trim(); }).map(function (v) {
    return { name: v.name.trim(), value: v.value, secret: !!v.secret };
  });
  return '';
}

function setTab(t) {
  const e = byId(st.selected);
  if (t === 'vars' && e && e.type === 'service') {
    st.draftVars = varsOf(e).map(function (v) { return { name: v.name, value: v.value, secret: !!v.secret }; });
  }
  st.tab = t;
  renderDrawer();
}

function renderDrawer() {
  const dr = $('drawer');
  if (!dr) return;
  if (!st.selected) { dr.innerHTML = ''; return; }
  if (st.selected === 'settings') { dr.innerHTML = drawerSettings(); return; }
  const e = byId(st.selected);
  if (!e) { dr.innerHTML = ''; return; }

  /* у сценариев (workflow и pipeline) в боковой карточке только два поля:
     название сценария и выбор раннера */
  const scenario = isScenarioType(e);

    ? [{ k: 'settings', l: 'Настройки' }]
    : [{ k: 'overview', l: 'Обзор' }, { k: 'settings', l: 'Настройки' }];
  if (e.type === 'service') { tabs.push({ k: 'vars', l: 'Переменные' }, { k: 'deploys', l: 'Деплои' }, { k: 'logs', l: 'Логи' }); }
  if (scenario) st.tab = 'settings';

  let body = '';
  if (scenario) body = scenarioSettings(e);
  else if (st.tab === 'overview') body = tabOverview(e);
  else if (st.tab === 'settings') body = tabSettings(e);
  else if (st.tab === 'vars') body = tabVars(e);
  else if (st.tab === 'deploys') body = tabDeploys(e);
  else body = tabLogs(e);

  dr.innerHTML =
    '<div class="dr-head">' +

    const c = pickById(REDIS_CONFIGS, e.redisConfig);
    const d = typeof e.redisDisk === 'number' ? e.redisDisk : c.ssd;
    const x = redisCost(c, d);
    return head + '<div class="box-head"><b>Managed Redis · ' + esc(c.name) + '</b>' + edit + '</div>' +
      '<div class="box-row"><span>vCPU · RAM</span><span>' + c.vcpu + ' × ' + rate(RATES.redis.vcpu) + '/час · ' + c.ram + ' ГБ × ' + rate(RATES.redis.ram) + '/ГБ·час</span></div>' +
      '<div class="box-row"><span>Диск SSD</span><span>' + num(d) + ' ГБ × ' + rate(RATES.redis.ssd) + '/ГБ·час</span></div>' +
      '<div class="box-row"><span>Итого в месяц</span><span>' + fmt(x.total) + '</span></div>' + tail;
  }
  if (e.type === 's3') {
    const o = s3OptsOf(e), x = s3Cost(o);
    return head + '<div class="box-head"><b>Object Storage</b>' + edit + '</div>' +
      '<div class="box-row"><span>Хранение</span><span>' + num(o.storage) + ' ГБ × ' + rate(RATES.s3.storage) + '</span></div>' +
      '<div class="box-row"><span>Операции</span><span>чтение ' + num(o.read) + ' тыс. · запись ' + num(o.write) + ' тыс.</span></div>' +
      '<div class="box-row"><span>Исходящий трафик</span><span>' + num(o.egress) + ' ГБ × ' + rate(RATES.s3.egress) + '</span></div>' +
      '<div class="box-row"><span>Итого в месяц</span><span>' + fmt(x.total) + '</span></div>' + tail;
  }
  if (e.type === 'workflow') {
    const runs = typeof e.wfRuns === 'number' ? e.wfRuns : 1000;
    const x = wfCost(e.steps, runs);
    return head + '<div class="box-head"><b>Workflow Studio</b>' + edit + '</div>' +
      '<div class="box-row"><span>Запуск шага</span><span>' + fmt(RATES.workflow.step) + '</span></div>' +
      '<div class="box-row"><span>Шагов · запусков в месяц</span><span>' + e.steps + ' × ' + num(runs) + '</span></div>' +
      '<div class="box-row"><span>Итого в месяц</span><span>' + fmt(x.total) + '</span></div>' + tail;
  }
  if (e.type === 'pipeline') {
    const total = pipelineCost(e.steps);
    return head + '<div class="box-head"><b>Pipeline · ' + e.steps + ' шага</b>' + edit + '</div>' +
      '<div class="box-row"><span>Ветка</span><span>' + esc(e.branch || 'main') + '</span></div>' +
      '<div class="box-row"><span>Шаг деплоя</span><span>' + e.steps + ' × ' + fmt(RATES.container.step) + '</span></div>' +
      '<div class="box-row"><span>Стоимость запуска</span><span>' + fmt(total) + '</span></div>' + tail;
  }
  return '';
}

  if (e.type === 'service') {
    rows += row(I.repo, 'Репозиторий', e.repo || '—', true);
    rows += row(I.branch, 'Ветка', e.branch || '—', false);
    rows += row(I.scenario, 'Pipeline', 'Стандартный сценарий · 3 шага', true);
  }
  if (e.type === 'workflow') rows += row(I.wf, 'Шагов', String(e.steps), false);

    const masked = e.revealed ? esc(connStr(e)) : '••••••••••••';
    extra += '<div class="section"><h4>Данные для подключения</h4><div class="box">' +
      '<div class="drow"><span class="dico">' + I.key + '</span><span class="dlabel">DSN</span>' +

      '<div class="d-actions" style="margin-top:12px">' +

      '</div></div>';

    const runs = wfRunsOf(e);
    extra += '<div class="section"><h4>Сценарий</h4><div class="box">' +
      '<div class="box-row"><span>Описание</span><span>' + esc(e.description || '—') + '</span></div>' +

      '<div class="d-actions" style="margin-top:10px">' +
        '<button class="btn green sm" onclick="openEditor(\'' + esc(e.id) + '\',\'scenario\')">Открыть сценарий</button>' +
        '<button class="btn white sm" onclick="openEditor(\'' + esc(e.id) + '\',\'variables\')">Переменные</button>' +
      '</div></div></div>' +
      '<div class="section"><h4>Последние запуски</h4><div class="box">' +
        '<div class="box-head"><b>Прогонов: ' + runs.length + '</b>' +
          '<button class="btn white sm" onclick="openEditor(\'' + esc(e.id) + '\',\'runs\')">Вся история</button></div>' +
        '<table class="hist"><thead><tr><th>Run</th><th>Статус</th><th>Триггер</th><th>Дата</th></tr></thead><tbody>' +
        runs.slice(0, 3).map(function (r) {
          return '<tr><td class="mono">' + esc(r.id) + '</td><td>' + statusBadge(r.status) + '</td>' +
            '<td>' + esc(r.trigger) + '</td><td>' + esc(absTime(new Date(r.at))) + '</td></tr>';
        }).join('') +
        '</tbody></table></div></div>' +
      '<div class="section"><h4>Триггеры</h4><div class="box">' +
        '<div class="box-head"><b>' + wfTriggersOf().length + ' триггера</b>' +
          '<button class="btn white sm" onclick="openEditor(\'' + esc(e.id) + '\',\'triggers\')">Настроить</button></div>' +
        wfTriggersOf().map(function (t) {
          return '<div class="box-row"><span>' + esc(t.title) + '</span><span>' + esc(t.detail) + '</span></div>';

  if (e.type === 'service') {
    const vcpu = servVcpu(e), ramMb = servRamMb(e);
    extra += '<div class="section"><h4>Конфигурация и прогноз</h4><div class="box">' +
      '<div class="box-head"><b>Container Apps · ' + cpuText(vcpu) + ' vCPU · ' + ramText(ramMb) + '</b>' +
        '<button class="btn white sm" onclick="setTab(\'settings\')">Изменить</button></div>' +
      '<div class="box-row"><span>vCPU · RAM</span><span>' + cpuText(vcpu) + ' × ' + rate(RATES.container.vcpu) + '/час · ' + ramText(ramMb) + ' × ' + rate(RATES.container.ram) + '/ГБ·час</span></div>' +
      '<div class="box-row"><span>Цена за реплику</span><span>' + fmt(servPerReplica(e)) + ' / мес</span></div>' +
      '<div class="box-row"><span>Итого в месяц</span><span>' + serviceTotalLabel(e) + '</span></div>' +
      '<div class="hint-text">Итого = реплики × стоимость реплики + деплой ' + fmt(DEPLOY_COST) + ', Artifact Registry ' + fmt(ARTIFACT_COST) + ' и Repo ' + fmt(REPO_COST) + '.</div>' +
      '</div></div>' +
      '<div class="section"><h4>Масштабирование</h4><div class="box">' +
        '<div class="box-head"><b>Реплики</b><span class="hint-chip">ручное</span></div>' +
        '<div class="box-row"><span>Количество</span><span>' + repCount(e) + '</span></div>' +
        '<div class="d-actions" style="margin-top:10px"><button class="btn white sm" onclick="setTab(\'settings\')">Изменить</button></div>' +
      '</div></div>';
